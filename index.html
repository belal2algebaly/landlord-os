<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>Landlord OS</title>
  <meta name="description" content="A calm rental management operating system for small landlords." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./v3.css" />
  <link rel="stylesheet" href="./cloud.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark">L</div><div><strong>Landlord OS</strong><small>Rental portfolio</small></div></div>
      <nav id="nav"></nav>
      <div class="side-bottom">
        <div class="mini-card"><span>Portfolio</span><strong id="portfolioCount">0 properties</strong><small>Cloud synced with Supabase</small></div>
        <button class="btn ghost small" id="exportBtn">Export backup</button>
        <button class="btn ghost small" id="resetBtn">Reset demo data</button>
      </div>
    </aside>
    <main>
      <header class="top">
        <div><span class="eyebrow"></span><h1 id="pageTitle">Landlord OS</h1></div>
        <div class="searchbox">⌕<input id="globalSearch" placeholder="Search property or tenant"><div id="searchResults" class="search-results hidden"></div></div>
        <div class="hero-actions"><button class="btn primary" id="addPropertyBtn">＋ Add property</button></div>
      </header>
      <div id="content"></div>
    </main>
  </div>
  <div class="quick-menu"><button class="quick-main" id="quickMain" aria-label="Quick add">＋</button><div class="quick-options hidden" id="quickOptions"><button data-quick="property">Add property</button><button data-quick="tenant">Add tenant</button><button data-quick="payment">Record payment</button><button data-quick="expense">Add expense</button><button data-quick="maintenance">New maintenance issue</button></div></div>
  <div id="modalRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./cloud-bootstrap.js"></script>
  <script>
    (() => {
      let started = false;
      const boot = () => {
        if (started) return;
        try {
          if (typeof LOS3 !== 'undefined' && LOS3 && typeof LOS3.init === 'function') {
            started = true;
            LOS3.init();
            return;
          }
        } catch (_) {}
        setTimeout(boot, 150);
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
